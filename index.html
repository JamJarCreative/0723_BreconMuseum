<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content='width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=yes'>
    <title>0723_BreconMuseum</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        /* Font family */
        /* Light (300) */
        @font-face {
          font-family: 'WalesSans';
          src: url('/assets/WalesSans/Body-Light.otf') format('opentype');
          font-weight: 300;
          font-style: normal;
          font-display: swap;
        }
        /* Regular (400) */
        @font-face {
          font-family: 'WalesSans';
          src: url('/assets/WalesSans/Body-Regular.otf') format('opentype');
          font-weight: 400;
          font-style: normal;
          font-display: swap;
        }
        /* Medium (500) */
        @font-face {
          font-family: 'WalesSans';
          src: url('/assets/WalesSans/Body-Medium.otf') format('opentype');
          font-weight: 500;
          font-style: normal;
          font-display: swap;
        }
        html{
            height: -webkit-fill-available;
        }
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            width: 100vw;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-[#000] font-[WalesSans]">
    <!--IMAGETARGETS-->
		<imagetarget id='Ballot Box' src='targets/Ballot Box.jpg'></imagetarget>
		<imagetarget id='Cresset Stone' src='targets/Cresset Stone.jpg'></imagetarget>
		<imagetarget id='Houses to Hovels' src='targets/Houses to Hovels.jpg'></imagetarget>
		<imagetarget id='The Climb' src='targets/The Climb.jpg'></imagetarget>

    <video id="webcam-video" muted autoplay playsinline class="w-px absolute"></video>
    <canvas id="video-canvas" class="w-full h-full object-cover absolute"></canvas>
    <div id="screenshotDiv" style="display: none;" class="ctaDiv">
        <div style="position:relative; background-color:white; padding:10px; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.3), 0 6px 20px 0 rgba(0, 0, 0, 0.25);">
            <img id="screenshotImg" src="" alt="screenshot" style="width:80vw; height:80vh">
            <button onclick="document.getElementById('screenshotDiv').style.display = 'none';" style="position:absolute; transform:translateY(-100%); right:0; top:0">Close</button>
        </div>
    </div>
    <div id="confirmUrlDiv" style="display: none;" class="ctaDiv">
        <div style="position:relative; background-color:white; padding:10px; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.3), 0 6px 20px 0 rgba(0, 0, 0, 0.25); width: 80vw; display:flex; flex-direction: column; align-items: center;">
            <p id="confirmUrlText" style="text-align: center; width:80%; overflow: hidden; text-overflow: ellipsis;">Are you sure you want to visit url.com?</p>
            <div>
                <button onclick="window.open(newUrlString, '_blank').focus(); document.getElementById('confirmUrlDiv').style.display = 'none'">VISIT SITE</button>
                <button onclick="document.getElementById('confirmUrlDiv').style.display = 'none'">GO BACK</button>
            </div>
        </div>
    </div>
    <div id="errorDiv" style="display: none;" class="bg-[#354b4f] justify-center">
        <p id="errorText" class="text-center text-white"></p>
    </div>
    <div id="unity-container" class="unity-mobile">
        <div id="custom-loading" class="
             w-full
             h-full
             flex
             flex-col
             justify-between
             bg-[url(/assets/background.ladder.svg)]
             landscape:bg-[url(/assets/background.plain.svg)]
             sm:[@media(orientation:portrait)]:bg-[url(/assets/background.plain.svg)]
             bg-no-repeat
             bg-cover
             bg-center
             ">
            <div id="loading-header" class="p-4 px-5 pb-8">
                <div class="
                     block
                     pt-6
                     landscape:pb-6
                     bg-[url(/assets/StoriPowys_logo.svg)]
                     bg-origin-content
                     bg-no-repeat
                     bg-contain
                     w-[42%]
                     sm:[@media(orientation:portrait)]:w-[20%]
                     portrait:h-[30%]
                     landscape:h-[31%]
                     "></div>
                <h1 class="text-5xl portrait:text-4xl pb-2 font-medium text-[#fbe8d4] w-[50%]">Amgueddfa y Gaer</h1>
                <h1 class="text-5xl portrait:text-4xl pt-2 font-medium text-[#fbe8d4] w-[50%]">Y Gaer Museum</h1>
                <div class="py-4"></div>
                <h2 class="text-2xl font-light text-[#d7feff]">AR Experience</h2>
                <h2 class="text-2xl font-light text-[#d7feff]">Profiad AR</h2>
            </div>
            <div id="overlay-images" class="h-full w-full absolute">
                <div id="bird" class="
                     bg-[url(/assets/bird.svg)]
                     bg-size-[100%]
                     bg-no-repeat
                     portrait:size-[48px]
                     landscape:size-[96px]
                     sm:[@media(orientation:portrait)]:size-[96px]
                     absolute
                     top-[6dvh]
                     left-[50dvw]
                     portrait:left-[65dvw]
                     sm:[@media(orientation:portrait)]:left-[50dvw]
                 "></div>
                <div id="ladder" class="
                     landscape:block
                     sm:[@media(orientation:portrait)]:block
                     portrait:hidden
                     bg-[url(/assets/ladder.svg)]
                     bg-size-[45%]
                     sm:[@media(orientation:portrait)]:bg-size-[59.5%]
                     bg-no-repeat
                     bg-position-[100%_40.75%]
                     sm:[@media(orientation:portrait)]:bg-position-[100%_100%]
                     size-[100%]"></div>
            </div>
            <div id="loading-footer" class="mb-8 landscape:mb-16 flex justify-center items-center flex-col">
                <h2 class="text-1xl uppercase portrait:text-[#3d585c] landscape:text-[#fcecdb]">Loading...</h2>
                <div class="w-40 h-3 border-2 portrait:border-[#3d585c] landscape:border-[#fcecdb] overflow-hidden rounded">
                    <div id="jam-progress-bar" class="h-3 portrait:bg-[#354b4f] landscape:bg-[#fcecdb] w-0 transition-all duration-500"></div>
                </div>
            </div>
        </div>
        <canvas id="unity-canvas" style="width: 100%; height: 100%; background: #0000; z-index: -99"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <canvas id="video-canvas"></canvas>
    </div>
    <script src="arcamera.js" type="text/javascript"></script>
    <script src="itracker.js" type="text/javascript"></script>
    <script src="Build/0723_BreconMuseum.loader.js"></script>
    <script>
            var initialize = async() =>{
                var unityCanvas = document.querySelector("#unity-canvas");
                var videoCanvas = document.querySelector("#video-canvas");
                window.arCamera = new ARCamera(unityCanvas, videoCanvas);
                window.iTracker = new ImageTracker(arCamera);
                try{
                    await window.iTracker.initialize("./opencv.js");
                    console.log("ImageTracker initialized!");
                }
                catch{
                    console.error("Failed to initialize ImageTracker. Are you missing opencv.js? " + error);
                    ShowError("Failed to initialize the experience.");
                    return;
                }
                await LoadWebcams();
                window.permissionsGranted = IsCameraPermissionGranted();
            }
            initialize();
            var container = document.querySelector("#unity-container");
            var canvas = document.querySelector("#unity-canvas");
            var loadingBar = document.querySelector("#unity-loading-bar");
            var progressBarFull = document.querySelector("#unity-progress-bar-full");
            var customLoading = document.querySelector("#custom-loading");
            var customProgressBar = document.querySelector("#jam-progress-bar");
            customProgressBar.style.width = "0%";
            function StartAR() {
                canvas.style.width = window.innerWidth + "px";
                canvas.style.height = window.innerHeight + "px";
                loadingBar.style.display = "none";
                createUnityInstance(document.querySelector("#unity-canvas"), {
                    dataUrl: "Build/0723_BreconMuseum.data.unityweb",
                    frameworkUrl: "Build/0723_BreconMuseum.framework.js.unityweb",
                    codeUrl: "Build/0723_BreconMuseum.wasm.unityweb",
                    streamingAssetsUrl: "StreamingAssets",
                    companyName: "Jam Creative Studios",
                    productName: "0723_BreconMuseum",
                    productVersion: "0.1.0",
                    //webglContextAttributes: { "preserveDrawingBuffer": true },
                    // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
                    // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
                    },
                    (progress) => {
                        progressBarFull.style.width = 100 * progress + "%";
                        customProgressBar.style.width = 100 * progress + "%";
                    }
                ).then((unityInstance) => {
                    window.unityInstance = unityInstance;
//                    if(window.permissionsGranted)
//                        RequestWebcam();
                    customLoading.style.display = "none";
                });
            }
            //Set Facing Mode here ('environment', 'user', '')
		window.unityFacingMode = "environment"
            window.WEBCAM_SETTINGS = {
                video: {
                    facingMode: unityFacingMode,
                },
                audio: false
            };
            window.requestingForPermissions = false;
            async function RequestWebcam(){
                window.requestingForPermissions = true;
                try{
                    window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
                    console.log("Webcam access granted");
                    requestingForPermissions = false;
                    // Immediately stop the stream to release the camera
                    // StopWebcam();
                }
                catch (err) {
                    //user denied camera permission - show error panel
                    console.error("getUserMedia error - " , err);
                    ShowError("Failed to start the experience.<br />Camera permission was denied<br /><br />Wedi methu dechrau'r profiad.<br/>Gwrthodwyd caniatâd camera");
                    window.requestingForPermissions = false;
                }
            }
            function StopWebcam(){
                console.log("stopping camera");
                window.webcamStream.getTracks().forEach(track => track.stop());
            }
            async function StartWebcam(){
                console.log("StartWebcam")
                window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
                while (window.requestingForPermissions) {
                    // Wait until requestingForPermissions becomes true.
                    console.log("Waiting for permissions...");
                    await new Promise(resolve => setTimeout(resolve, 100)); // Adjust the delay time as needed.
                }
                console.log("Got Permissions");
                if(window.webcamStream)
                {
                    const video = document.querySelector("#webcam-video");
                    video.srcObject = webcamStream;
                    try {
                        await arCamera.startWebcam(video);
                        console.log("Webcam started successfully");
                        window.unityInstance.SendMessage('ARCamera', 'OnStartWebcamSuccess');
                    }
                    catch(err){
                        console.error("Webcam failed to start - ", err);
                        window.unityInstance.SendMessage('ARCamera', 'OnStartWebcamFail');
                    }
                }
                else{
                    console.error("Webcam failed to start - permission not yet granted");
                    window.unityInstance.SendMessage('ARCamera', 'OnStartWebcamFail');
                }
            }
            async function LoadWebcams(){
                let camDevices = [];
                // let backCams = [];
                let devices = await navigator.mediaDevices.enumerateDevices();
                var ctr = 0;
                devices.forEach(mediaDevice => {
                    if (mediaDevice.kind === 'videoinput') {
                        if(window.unityFacingMode == 'environment' && !mediaDevice.label.includes('facing front')){
                            //back cam only
                            camDevices.push(mediaDevice);
                        }
                        else if(window.unityFacingMode == 'user' && mediaDevice.label.includes('facing front')){
                            //front cam only
                            camDevices.push(mediaDevice);
                        }
                        else{
                            //back and front
                            camDevices.push(mediaDevice);
                        }
                        ctr++;
                    }
                });
                //reverse array because some Android phones can't distinguish front and back cams at first load
                //and when this happens, most of the time, front cam goes first and back cam goes last
                camDevices = camDevices.reverse();
                if(camDevices.length > 0) {
                    window.deviceId = camDevices[0].deviceId;
                }
                iTracker.WEBCAM_NAME = "Camera";// select.options[select.selectedIndex].innerHTML;
                StartAR();
            }
            async function FlipCam(){
                arCamera.stopWebcam();
                window.WEBCAM_SETTINGS.video.deviceId = '';
                if(window.WEBCAM_SETTINGS.video.facingMode == 'user'){
                    window.WEBCAM_SETTINGS.video.facingMode = 'environment';
                    arCamera.setFlipped(false);
                }
                else{
                    window.WEBCAM_SETTINGS.video.facingMode = 'user';
                    arCamera.setFlipped(true);
                }
                window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
                const video = document.querySelector("#webcam-video");
                video.srcObject = webcamStream;
                await arCamera.startWebcam(video);
            }
            async function IsCameraPermissionGranted() {
                if (!navigator.permissions || !navigator.mediaDevices) {
                    console.log("Permissions API or mediaDevices not supported.");
                    return false;
                }
                try {
                    // Query the status of the camera permission
                    const permissionStatus = await navigator.permissions.query({ name: "camera" });
                    if (permissionStatus.state === "granted") {
                    console.log("Camera permission has already been granted.");
                    return true;
                    } else if (permissionStatus.state === "prompt") {
                    console.log("Camera permission is promptable.");
                    return false;
                    } else {
                    console.log("Camera permission has been denied.");
                    return false;
                    }
                } catch (error) {
                    console.log("Error checking camera permission:", error);
                    return false;
                }
            }
            function ShowError(error){
                document.getElementById("errorDiv").style.display = "flex";
                document.getElementById("errorText").innerHTML = error;
            }
            function ShowScreenshot(dataUrl){
                document.getElementById("screenshotDiv").style.display = "flex";
                document.getElementById("screenshotImg").src = dataUrl;
                document.getElementById("screenshotImg").style.width = "80vw";
                document.getElementById("screenshotImg").style.height = 80 / window.innerWidth * window.innerHeight + "vw";
            }
            function ShowConfirmUrl(url){
                document.getElementById("confirmUrlDiv").style.display = "flex";
                window.newUrlString = url;
                document.getElementById("confirmUrlText").innerText = "Are you sure you want to visit " + url;
            }
            window.ITRACKER_GLOBALS = {
                //place global settings here
                INTERNAL_SMOOTHFACTOR_POS: .075,
            }
    </script>
</body>
</html>
